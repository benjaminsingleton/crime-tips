# Local / developer defaults. For production self-host, also load the overlay:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crimetips}
      POSTGRES_USER: ${POSTGRES_USER:-crimetips}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crimetips}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crimetips} -d ${POSTGRES_DB:-crimetips}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Published for local tools / host-gateway fallbacks. Prefer the internal
    # hostname `db` from the app container on a normal Docker bridge.
    # Production overlay removes this publish.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  app:
    # Local/dev: `docker compose up --build` builds from the Dockerfile.
    # Production: set CRIME_TIPS_IMAGE to a GHCR tag and use the prod overlay
    # (which disables build and pulls the published image).
    build: .
    image: ${CRIME_TIPS_IMAGE:-crime-tips:local}
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      # Keep local compose usable with example secrets; prod overlay sets production.
      CRIME_TIPS_ENV: ${CRIME_TIPS_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-crimetips}:${POSTGRES_PASSWORD:-crimetips}@db:5432/${POSTGRES_DB:-crimetips}}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      ADMIN_RANK: ${ADMIN_RANK:-Admin}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-System}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Administrator}
      UPLOAD_DIR: /data/uploads
      CLIENT_DIST: /app/client/dist
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@crimetips.local}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      MAX_ATTACHMENTS_PER_TIP: ${MAX_ATTACHMENTS_PER_TIP:-10}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Optional officer TOTP MFA
      MFA_REQUIRED: ${MFA_REQUIRED:-}
      MFA_ISSUER: ${MFA_ISSUER:-}
      MFA_PENDING_TTL_SEC: ${MFA_PENDING_TTL_SEC:-}
      # Optional agency OIDC SSO (unset = disabled)
      OIDC_ENABLED: ${OIDC_ENABLED:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_EMAIL_CLAIM: ${OIDC_EMAIL_CLAIM:-}
      OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-}
      OIDC_ALLOW_PASSWORD: ${OIDC_ALLOW_PASSWORD:-}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-}
      OIDC_DEFAULT_RANK: ${OIDC_DEFAULT_RANK:-}
      OIDC_ALLOW_INSECURE: ${OIDC_ALLOW_INSECURE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/data/uploads
    ports:
      - "${APP_PORT:-8080}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
