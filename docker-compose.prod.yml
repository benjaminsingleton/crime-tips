# Production overlay — use with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Exposes only the reverse proxy on 80/443. Postgres and the app stay on the
# internal Compose network (no host publish for db).

services:
  db:
    ports: !reset []
    restart: unless-stopped
    networks:
      - internal

  app:
    ports: !reset []
    environment:
      NODE_ENV: production
      CRIME_TIPS_ENV: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      MAX_ATTACHMENTS_PER_TIP: ${MAX_ATTACHMENTS_PER_TIP:-10}
      TRUST_PROXY: ${TRUST_PROXY:-true}
    networks:
      - internal
    restart: unless-stopped
    # Prefer no host publish. For agency edge TLS (no Caddy), use BYO profile below
    # or temporarily publish loopback only.

  proxy:
    image: caddy:2.8-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
      - public
    restart: unless-stopped

networks:
  internal:
    driver: bridge
  public:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
